<!doctype html>
<html lang="he" dir="rtl" data-size="large">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>שביל – הטיול שלי</title>
<meta name="theme-color" content="#6B3FA0">
<meta name="description" content="אפליקציית טיולים: ציר זמן, יומן וספר זיכרונות">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: the whole trip as one continuous scroll; each day has a sticky purple header, its own faint background,
   a winding dashed trail, travel lines between stops, and today's current stop enlarged into a card. */
:root{
  --purple:#6B3FA0; --purple-dark:#4A2063; --lilac:#A87CD8; --lilac-light:#DBC8F2;
  --blue-deep:#1E4E8C; --blue:#4A86D8; --sky:#A9C9F2; --gold:#EFC12E; --red:#C82A4C;
  --ink:#241A2B; --ink-soft:#5B4A6B; --paper:#FCFBFD; --white:#FFFFFF; --ok:#2E6B45;
  --f-display:'Varela Round','Rubik',Arial,sans-serif;
  --f-body:'Rubik',Arial,sans-serif;
}
html{font-size:18px}
html[data-size="big"]{font-size:16px}
html[data-size="large"]{font-size:18px}
html[data-size="huge"]{font-size:21px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--purple)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.day{position:relative;padding-bottom:1.6rem}
.day.city{background-color:#F9F7FB;background-repeat:repeat-y;background-size:100% auto;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 390 760' preserveAspectRatio='none'><rect width='390' height='760' fill='%23F6F2F9'/><path d='M0 610 C 90 560, 150 660, 250 600 S 360 520, 390 560' fill='none' stroke='%23A9C9F2' stroke-opacity='0.45' stroke-width='34' stroke-linecap='round'/><g stroke='%23FFFFFF' stroke-width='9' stroke-linecap='round'><line x1='0' y1='120' x2='390' y2='90'/><line x1='0' y1='300' x2='390' y2='330'/><line x1='0' y1='470' x2='390' y2='440'/><line x1='90' y1='0' x2='120' y2='760'/><line x1='250' y1='0' x2='220' y2='760'/></g><g stroke='%23FFFFFF' stroke-width='4' stroke-linecap='round'><line x1='0' y1='210' x2='390' y2='200'/><line x1='0' y1='390' x2='390' y2='395'/><line x1='170' y1='0' x2='175' y2='760'/><line x1='320' y1='0' x2='330' y2='760'/></g><rect x='130' y='130' width='80' height='60' rx='14' fill='%23DBC8F2' fill-opacity='0.45'/><rect x='20' y='660' width='120' height='70' rx='18' fill='%23DBC8F2' fill-opacity='0.45'/></svg>")}
.day.nature{background-color:var(--paper);background-repeat:no-repeat;background-size:100% auto;background-position:top center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 390 760'><g opacity='0.22'><rect width='390' height='760' fill='%23A9C9F2'/><circle cx='300' cy='120' r='46' fill='%23EFC12E'/><path d='M0 330 C 80 260, 160 300, 230 250 S 350 230, 390 270 V760 H0 Z' fill='%23A87CD8'/><path d='M0 430 C 100 370, 190 440, 280 390 S 370 380, 390 400 V760 H0 Z' fill='%234A86D8'/><path d='M0 540 C 120 490, 210 560, 300 510 S 370 500, 390 520 V760 H0 Z' fill='%236B3FA0'/></g></svg>")}

.dayhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--purple);color:var(--white);border-radius:0 0 1.1rem 1.1rem;
  padding:.65rem max(16px,env(safe-area-inset-right,0px)) .7rem max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.dayhead .eyebrow{font-size:.8rem;color:var(--lilac-light)}
.dayhead h2{margin:0;font-family:var(--f-display);font-size:1.5rem;line-height:1.15;font-weight:400}
.dayhead .sub{font-size:.8rem;color:var(--lilac-light)}
.todaybadge{display:inline-block;background:var(--gold);color:var(--ink);font-weight:700;border-radius:1rem;padding:0 .5rem;margin-inline-start:.3rem}
.sun{flex:none;width:2rem;height:2rem}
.daybody{padding:1rem max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}

.trail{position:relative;display:flex;flex-direction:column;gap:.2rem}
.trail::before{content:"";position:absolute;top:1rem;bottom:1rem;right:0;width:3rem;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='64' viewBox='0 0 48 64'><path d='M24 0 C 8 16, 40 48, 24 64' fill='none' stroke='%236B3FA0' stroke-width='4' stroke-dasharray='2 10' stroke-linecap='round'/></svg>") repeat-y center top / 3rem 4rem}
.row{position:relative;display:flex;gap:.6rem;align-items:flex-start;padding:.3rem 0}
.mkcol{width:3rem;flex:none;display:flex;justify-content:center;padding-top:.3rem}
.mk{width:2.3rem;height:2.3rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;border:3px solid var(--white)}
.mk.done{background:var(--lilac)}
.mk.todo{background:var(--white);border:.18rem solid var(--purple);color:var(--purple)}
.mk.cancel{background:#E7E1EE;color:var(--ink-soft)}
.mk.cur{width:2.6rem;height:2.6rem;background:var(--red);color:var(--white);border-width:.2rem;box-shadow:0 0 0 .18rem var(--red);font-size:1.1rem}
.mk svg{width:1.1rem;height:1.1rem}

.stop{background:var(--white);border:0;border-radius:.7rem;padding:.4rem .65rem;text-align:right;color:var(--ink);min-width:0;max-width:100%;display:flex;flex-direction:column}
.stop .t{font-size:1.15rem;font-weight:700;line-height:1.2}
.stop .m{font-size:.85rem;color:var(--ink-soft)}
.stop.done .t,.stop.done .m{color:var(--ink-soft)}
.stop.cancel .t{text-decoration:line-through;color:var(--ink-soft)}
.tag{font-size:.75rem;font-weight:700;border-radius:1rem;padding:0 .5rem;align-self:flex-start;margin-top:.15rem}
.tag.changed{background:#FFF4D6;color:#6B4E00}
.tag.cancel{background:#F2E6EA;color:#8A1F38}

.trow{display:flex;gap:.6rem;align-items:center}
.trow .mkcol{padding:0}
.tr{display:flex;flex-wrap:wrap;align-items:center;gap:.15rem .5rem;background:rgba(255,255,255,.88);border:1.5px dashed var(--lilac);border-radius:.7rem;padding:.25rem .55rem;font-size:.8rem;color:var(--ink-soft);min-width:0}
.tr svg{width:1rem;height:1rem;flex:none}
.tr b{color:var(--purple-dark)}
.tr.past{opacity:.6}
.gm{color:var(--blue-deep);font-weight:700;text-decoration:underline;text-underline-offset:2px}

.card{flex:0 1 auto;width:75%;min-width:0;background:var(--white);border-radius:1.1rem;overflow:hidden;box-shadow:0 .2rem 0 var(--lilac)}
.card .band{height:2.8rem;background:var(--sky);position:relative;overflow:hidden}
.card .band svg{position:absolute;left:0;bottom:0;height:100%;width:auto}
.card .body{padding:.5rem .7rem .6rem;display:flex;flex-direction:column;gap:.1rem}
.card .lbl{font-size:.8rem;font-weight:700;color:var(--purple-dark)}
.card .t{font-size:1.3rem;font-weight:700;line-height:1.15}
.card .m{font-size:.85rem;color:var(--ink-soft)}
.card .btns{margin-top:.3rem}
.card .b{min-height:2.2rem;font-size:.85rem;padding:0 .5rem}
.btns{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.45rem}
.b{flex:1;min-height:2.5rem;font-size:.9rem;font-weight:700;border-radius:1.25rem;border:2px solid var(--purple);background:var(--white);color:var(--purple);padding:0 .7rem}
.b.p{background:var(--purple);color:var(--white)}
.b.g{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.b.r{border-color:var(--red);color:var(--red)}
.b.on{background:var(--purple);color:var(--white)}

.ended{flex:0 1 auto;width:75%;background:var(--white);border-radius:1.1rem;padding:.8rem;display:flex;flex-direction:column;gap:.3rem;box-shadow:0 .2rem 0 var(--gold)}
.ended .t{font-size:1.25rem;font-weight:700}
.summary{margin-top:1rem;background:var(--white);border-radius:1rem;padding:.8rem;display:flex;flex-direction:column;gap:.3rem}
.summary h3{margin:0;font-size:1rem;color:var(--purple-dark)}
.summary .txt{white-space:pre-wrap;font-size:.95rem}
.summary .empty{color:var(--ink-soft);font-size:.9rem}
.expstate{font-size:.8rem;font-weight:700;border-radius:1rem;padding:.1rem .6rem;align-self:flex-start}
.expstate.ok{background:#E3F1E8;color:var(--ok)}
.expstate.no{background:#FFF4D6;color:#6B4E00}
.add{width:100%;margin-top:.6rem;border-style:dashed;background:rgba(255,255,255,.7)}
.alltrip{margin-top:.8rem;background:var(--white);border:2px solid var(--gold);border-radius:1rem;padding:.8rem}
.testline{font-size:.7rem;color:var(--ink-soft);padding:1rem 16px 1.5rem;text-align:center}

nav{position:sticky;bottom:0;z-index:5;display:flex;gap:.45rem;background:var(--white);
  padding:.55rem max(16px,env(safe-area-inset-right,0px)) calc(.7rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -1px 0 var(--lilac-light)}
nav .b{min-height:2.7rem}
nav .size{flex:none;width:3.2rem}
nav .b:disabled{opacity:.35;cursor:default}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(36,26,43,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--white);width:100%;max-width:40rem;max-height:92vh;overflow:auto;border-radius:1.2rem 1.2rem 0 0;
  padding:1rem max(16px,env(safe-area-inset-right,0px)) calc(1.4rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel h3{margin:0;font-size:1.5rem;line-height:1.15}
.panel .m{color:var(--ink-soft);font-size:.9rem}
.panel h4{margin:1rem 0 .25rem;font-size:1rem;color:var(--purple-dark)}
.panel p{margin:.25rem 0}
.close{float:left;width:2.6rem;height:2.6rem;border:0;background:var(--paper);border-radius:50%;font-size:1.2rem;color:var(--ink-soft)}
.more{background:var(--paper);border-radius:.8rem;padding:.6rem .7rem;margin-top:.4rem}
.src{font-size:.8rem;color:var(--ink-soft);margin-top:.5rem}
label.f{display:block;margin-top:.6rem;font-size:.85rem;color:var(--ink-soft)}
input,textarea,select{width:100%;font:inherit;font-size:1rem;padding:.45rem .55rem;border-radius:.6rem;border:2px solid var(--lilac-light);background:var(--paper);color:var(--ink)}
textarea{min-height:5rem;resize:vertical}
.pair{display:flex;gap:.5rem}.pair>*{flex:1;min-width:0}
.saved{font-size:.8rem;color:var(--ok);min-height:1.1rem}

.card .band.photo{height:6rem;background:var(--lilac-light)}
.card .band img{width:100%;height:100%;object-fit:cover;display:block}
a.b{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.dayactions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem}
.thumbs{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem}
.thumbs button{padding:0;border:0;background:var(--lilac-light);width:5rem;height:5rem;border-radius:.6rem;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.locline{font-size:.85rem;color:var(--ink-soft)}
.mapwrap{height:62vh;border-radius:.8rem;overflow:hidden;margin-top:.6rem;background:#EEE9F4;direction:ltr}
.numpin{width:30px;height:30px;border-radius:50%;background:#6B3FA0;color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font:700 14px Rubik,Arial,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.numpin.done{background:#A87CD8}
.numpin.cur{background:#C82A4C}
.pop{direction:rtl;text-align:right;font-family:Rubik,Arial,sans-serif;min-width:9rem}
.pop img{width:100%;max-width:12rem;border-radius:.4rem;display:block;margin-top:.3rem}
.photoview img{max-width:100%;max-height:70vh;border-radius:.6rem}
.reset{background:none;border:0;color:var(--ink-soft);text-decoration:underline;font:inherit;font-size:.7rem;cursor:pointer}
.tripcard{margin:.8rem 16px 0;background:var(--white);border-radius:1.1rem;padding:.8rem .9rem;border:2px solid var(--lilac-light);display:flex;flex-direction:column;gap:.25rem}
.tripcard h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.6rem;color:var(--purple-dark);line-height:1.15}
.tripcard .range{font-size:.9rem;color:var(--ink-soft);font-weight:600}
.tripcard .notes{white-space:pre-wrap;font-size:.95rem}
.triplist{display:flex;flex-direction:column;gap:.5rem;margin-top:.3rem}
.tripitem{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;width:100%;text-align:right;background:var(--paper);border:2px solid var(--lilac-light);border-radius:.9rem;padding:.6rem .8rem;font:inherit;color:var(--ink);cursor:pointer}
.tripitem.on{border-color:var(--purple);background:var(--white)}
.tripitem .t{font-weight:700;font-size:1.05rem}
.tripitem .m{font-size:.8rem;color:var(--ink-soft)}
.sizes{display:flex;gap:.4rem}
.sizes .b{min-height:2.8rem}
.hedit{flex:none;background:rgba(255,255,255,.16);border:1.5px solid var(--lilac-light);color:var(--white);border-radius:1rem;padding:.25rem .6rem;font:inherit;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:.3rem}
.hedit svg{width:.95rem;height:.95rem}
.headside{display:flex;flex-direction:column;align-items:center;gap:.35rem;flex:none}
.addday{display:block;width:calc(100% - 32px);margin:.8rem auto;min-height:2.6rem;border:2px dashed var(--purple);border-radius:1.3rem;background:var(--white);color:var(--purple);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.stayrow{margin-top:.7rem;background:var(--white);border:2px solid var(--lilac);border-radius:1rem;padding:.6rem .7rem;display:flex;flex-direction:column;gap:.35rem}
.stayrow .top{display:flex;align-items:center;gap:.5rem;background:none;border:0;padding:0;text-align:right;color:var(--ink);font:inherit;cursor:pointer}
.stayrow .top svg{width:1.6rem;height:1.6rem;flex:none}
.stayrow .t{font-weight:700;font-size:1.05rem;line-height:1.2}
.stayrow .m{font-size:.8rem;color:var(--ink-soft)}
.stayrow .btns{margin-top:0}
.stayrow .b{min-height:2.2rem;font-size:.85rem}
.vstop{background:rgba(255,255,255,.92);border:1.5px dashed var(--purple);border-radius:.7rem;padding:.35rem .6rem;text-align:right;color:var(--ink);display:flex;align-items:center;gap:.45rem;font:inherit;cursor:pointer;min-width:0}
.vstop svg{width:1.3rem;height:1.3rem;flex:none}
.vstop .t{font-weight:700;font-size:.95rem}
.vstop .m{font-size:.8rem;color:var(--ink-soft)}
.stop .ico{display:inline-flex;vertical-align:-.15em;margin-inline-end:.3rem}
.stop .ico svg{width:1.05rem;height:1.05rem}
.finfo{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;background:var(--paper);border-radius:.8rem;padding:.6rem .7rem;margin-top:.6rem;font-size:.9rem}
.finfo dt{color:var(--ink-soft)}.finfo dd{margin:0;font-weight:600}
.chooser{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem}
.chooser .b{min-height:3.2rem;font-size:1rem;justify-content:flex-start;display:flex;align-items:center;gap:.6rem;padding:0 1rem}
.chooser svg{width:1.4rem;height:1.4rem}
.cmp{background:var(--paper);border-radius:.8rem;padding:.6rem .7rem;margin-top:.6rem;display:flex;flex-direction:column;gap:.3rem}
.cmp .k{font-weight:700;color:var(--purple-dark)}
.cmp .v{font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
label.chk{display:flex;gap:.6rem;align-items:center;color:var(--ink)}
.viewbar{background:var(--gold);color:var(--ink);border-radius:1rem;padding:.7rem .9rem;margin:.6rem 0;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.viewbar span{font-size:.85rem}
.viewbar .btns{margin-top:0;flex:1 1 12rem}
html[data-ro="1"] [data-act="status"],html[data-ro="1"] [data-act="edit"],html[data-ro="1"] [data-act="editFlight"],html[data-ro="1"] [data-act="done"],
html[data-ro="1"] [data-act="newDay"],html[data-ro="1"] .hedit,html[data-ro="1"] [data-act="add"],html[data-ro="1"] [data-act="summary"],
html[data-ro="1"] [data-act="exportDay"],html[data-ro="1"] .alltrip,html[data-ro="1"] .expstate,html[data-ro="1"] [data-act="swap"],html[data-ro="1"] [data-act="undoSwap"],
html[data-ro="1"] [data-act="pickAlt"],html[data-ro="1"] [data-act="stayEdit"],html[data-ro="1"] [data-act="stayDel"],html[data-ro="1"] [data-act="stayLoc"],
html[data-ro="1"] [data-act="delPhoto"],html[data-ro="1"] [data-act="reset"],html[data-ro="1"] [data-act="addPhoto"]{display:none!important}
label.chk input{width:1.4rem;height:1.4rem;flex:none}
.driver{position:fixed;inset:0;z-index:30;background:var(--white);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1rem;padding:2rem 1.2rem;text-align:center}
.driver[hidden]{display:none}
.driver .big{font-size:2.6rem;font-weight:700;line-height:1.1;direction:ltr}
.driver .addr{font-size:1.6rem;direction:ltr}
.driver .he{font-size:1rem;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="main"></main>
<nav>
  <button class="b" id="prevDay" type="button">יום קודם</button>
  <button class="b" id="menuBtn" type="button" style="flex:none;padding:0 1rem">תפריט</button>
  <button class="b" id="nextDay" type="button">יום הבא</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="driver" id="driver" hidden></div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="importInput" accept=".json,application/json" hidden>

<script>
const KEY='trip-app-v1', SIZE_KEY='trip-app-size';
let data, storageOK=true, lastSaved='';

const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SUN='<svg class="sun" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="13" fill="#EFC12E"/><g stroke="#EFC12E" stroke-width="4" stroke-linecap="round"><line x1="32" y1="5" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="59"/><line x1="5" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="59" y2="32"/><line x1="13" y1="13" x2="18" y2="18"/><line x1="46" y1="46" x2="51" y2="51"/><line x1="13" y1="51" x2="18" y2="46"/><line x1="46" y1="18" x2="51" y2="13"/></g></svg>';
const BAND={
  city:'<svg viewBox="0 0 260 92" aria-hidden="true"><circle cx="40" cy="28" r="15" fill="#EFC12E"/><path d="M80 92 V60 H190 V92 Z" fill="#4A86D8"/><path d="M90 60 A45 36 0 0 1 180 60 Z" fill="#1E4E8C"/><rect x="90" y="66" width="8" height="26" fill="#A9C9F2"/><rect x="112" y="66" width="8" height="26" fill="#A9C9F2"/><rect x="150" y="66" width="8" height="26" fill="#A9C9F2"/><rect x="172" y="66" width="8" height="26" fill="#A9C9F2"/></svg>',
  nature:'<svg viewBox="0 0 260 92" aria-hidden="true"><circle cx="200" cy="26" r="14" fill="#EFC12E"/><path d="M0 70 C 60 40, 120 64, 180 46 S 240 50, 260 56 V92 H0 Z" fill="#A87CD8"/><path d="M0 84 C 70 64, 140 86, 200 70 S 250 72, 260 76 V92 H0 Z" fill="#6B3FA0"/><rect x="40" y="58" width="22" height="16" fill="#FCFBFD"/><path d="M37 58 L51 48 L65 58 Z" fill="#C82A4C"/></svg>'

  if(isFlight(e))return `המראה <span dir="ltr">${esc(e.time)}</span> · נחיתה <span dir="ltr">${esc(e.arrTime||'')}</span>${+e.arrPlusDays?' (+1)':''} · שעון מקומי<br>להגיע לשדה עד <span dir="ltr">${minusMin(e.time,e.airportBuffer||180)}</span>`;
  return `<span dir="ltr">${esc(e.time)}</span> · ${esc(e.local)}`;
}
function hasLoc(x){return x&&x.lat!==undefined&&x.lat!==null&&x.lat!=='';}
function point(e){return (e.lat!==undefined&&e.lat!==null&&e.lat!=='')?(e.lat+','+e.lng):(e.address||e.local||e.title);}
function gmUrl(prev,e){
  const md=MODE[e.travelMode]||MODE.walk;
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(pt(prev,'origin'))+'&destination='+encodeURIComponent(pt(e,'dest'))+'&travelmode='+md.gm;
}
/* Google Maps links accept an origin, a destination and up to 9 stops between them, so longer days are split into parts */
function dayRouteLinks(day,evs){
  const ms=morningStay(day.date), ns=stayForNight(day.date);
  const stops=[...(ms?[stayPoint(ms)]:[]),...evs.filter(e=>e.status!=='cancelled'),...(ns?[stayPoint(ns)]:[])];
  if(stops.length<2)return '';
  const mode=day.type==='nature'?'driving':'walking';
  const parts=[];let i=0;
  while(i<stops.length-1){const chunk=stops.slice(i,i+11);parts.push(chunk);i+=chunk.length-1;}
  return parts.map((c,k)=>{
    const url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(pt(c[0],'origin'))+'&destination='+encodeURIComponent(pt(c[c.length-1],'dest'))
      +(c.length>2?'&waypoints='+c.slice(1,-1).map(e=>encodeURIComponent(pt(e,'dest'))).join('%7C'):'')+'&travelmode='+mode;
    return `<a class="b" href="${url}" target="_blank" rel="noopener">${parts.length>1?'מסלול ב-Google Maps, חלק '+(k+1):'המסלול של היום ב-Google Maps'}</a>`;
  }).join('');
}

/* Photos live in the browser's larger photo store (IndexedDB); the trip data keeps only their details */
let dbp=null; const photoCache=new Map();
function idb(){
  if(dbp)return dbp;
  dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('trip-app-photos',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});
  return dbp;
}
async function photoPut(id,url){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(url,id);tx.oncomplete=()=>{photoCache.set(id,url);res();};tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
async function photoGet(id){
  if(photoCache.has(id))return photoCache.get(id);
  try{const db=await idb();return await new Promise(res=>{const r=db.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>{const u=r.result||null;if(u)photoCache.set(id,u);res(u);};r.onerror=()=>res(null);});}
  catch(e){return null;}
}
async function photoDel(id){photoCache.delete(id);try{const db=await idb();db.transaction('photos','readwrite').objectStore('photos').delete(id);}catch(e){}}
async function photoClearAll(){photoCache.clear();try{const db=await idb();db.transaction('photos','readwrite').objectStore('photos').clear();}catch(e){}}
function hydratePhotos(root){
  (root||document).querySelectorAll('img[data-photo]').forEach(async img=>{if(img.getAttribute('src'))return;const u=await photoGet(img.dataset.photo);if(u)img.src=u;});
}
function resizeImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const max=1280;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      res({url:c.toDataURL('image/jpeg',0.72),w,h});};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'));};
    img.src=url;
  });
}
function photoImg(p){const u=photoCache.get(p.id);return `<img data-photo="${p.id}" ${u?`src="${u}"`:''} alt="${esc(p.name)}">`;}
/* Today's current stop follows the clock: the stop whose time has come and whose next stop has not started yet.
   Earlier stops that were not marked are shown as 'not marked' instead of holding the enlarged card. */
function currentStop(evs,hm){
  const act=evs.filter(e=>e.status!=='cancelled');
  let idx=-1; act.forEach((e,i)=>{if(e.time<=hm)idx=i;});
  const unmarked=new Set(); for(let i=0;i<idx;i++){if(act[i].status!=='done')unmarked.add(act[i].id);}
  for(let i=Math.max(idx,0);i<act.length;i++){if(act[i].status!=='done'){unmarked.delete(act[i].id);return {cur:act[i],ended:false,unmarked};}}
  return {cur:null,ended:act.length>0,unmarked};
}
function travelRow(prev,e,past){
  if(!prev||e.status==='cancelled')return '';
  const md=MODE[e.travelMode]||MODE.walk;
  const url=gmUrl(prev,e);
  if(!e.travelMin){
    return `<div class="trow"><div class="mkcol"></div><div class="tr ${past?'past':''}">${md.icon}<span>${prev.isStay?'מהמלון · ':''}זמן הנסיעה לא הוזן${(hasLoc(prev)&&hasLoc(e)&&!isFlight(prev))?' · '+fmtKm(kmBetween(prev,e))+' בקו אווירי':''}</span>
      ${RO?(e.travelNote?`<button class="gm" style="background:none;border:0;padding:0;font:inherit" data-act="travelView" data-id="${e.id}" type="button">פרטי המסלול</button>`:''):`<button class="gm" style="background:none;border:0;padding:0;font:inherit" data-act="travel" data-id="${e.id}" type="button">${e.travelNote?'פרטי המסלול והוספת זמן':'הוספת זמן'}</button>`}
      <a class="gm" href="${url}" target="_blank" rel="noopener">בדיקה ב-Google Maps</a></div></div>`;
  }
  const target=isFlight(e)?minusMin(e.time,e.airportBuffer||180):e.time;
  const leave=minusMin(target,e.travelMin);
  return `<div class="trow"><div class="mkcol"></div><div class="tr ${past?'past':''}">${md.icon}<span>${prev.isStay?'מהמלון · ':''}${md.name} · ${esc(e.travelMin)} דק׳${e.travelEst?' (משוער)':''}</span>${isFlight(e)?`<b>להגיע לשדה עד <span dir="ltr">${target}</span></b>`:''}<b>לצאת עד <span dir="ltr">${leave}</span></b>${(e.travelStale||(e.travelFrom!==undefined&&e.travelFrom!==prev.id))?'<b style="color:var(--red)">· לבדוק שוב, התחנה הקודמת השתנתה</b>':''}
    ${RO?(e.travelNote?`<button class="gm" style="background:none;border:0;padding:0;font:inherit" data-act="travelView" data-id="${e.id}" type="button">פרטי המסלול</button>`:''):`<button class="gm" style="background:none;border:0;padding:0;font:inherit" data-act="travel" data-id="${e.id}" type="button">${e.travelNote?'פרטי המסלול ותיקון':'תיקון'}</button>`}
    <a class="gm" href="${url}" target="_blank" rel="noopener">בדיקה ב-Google Maps</a></div></div>`;
}
function openTravel(id){
  let e=ev(id); if(!e)return;
  const prev=prevPoint(e);
  const opt=v=>`<option value="${v}" ${(e.travelMode||'walk')===v?'selected':''}>${MODE[v].name}</option>`;
  openSheet(`<h3>נסיעה</h3>
    <div class="m">${prev?esc(isFlight(prev)?(prev.toName||prev.toCode):prev.title)+' ← ':''}${esc(isFlight(e)?(e.fromName||e.fromCode):e.title)} · ${isFlight(e)?'להגיע לשדה עד <span dir="ltr">'+minusMin(e.time,e.airportBuffer||180)+'</span>':'מגיעים ב-<span dir="ltr">'+esc(e.time)+'</span>'}</div>
    <form id="trForm">
      <div class="pair">
        <label class="f">איך מגיעים<select name="travelMode" id="t_mode">${opt('walk')}${opt('transit')}${opt('car')}</select></label>
        <label class="f">כמה דקות<input type="number" min="0" max="600" name="travelMin" id="t_min" value="${esc(e.travelMin)}" inputmode="numeric"></label>
      </div>
      <label class="f">פרטי המסלול (קו ותחנות, מספר אוטובוס, דרך מועדפת וכדומה)<textarea name="travelNote" id="t_note" rows="3" placeholder="למשל: קו אדום מתחנת יהודית לאליפלט, 6 דקות. משם ברגל דרך רחוב יפת">${esc(e.travelNote||'')}</textarea></label>
      ${prev?`<p class="m" style="margin-top:.6rem">לא בטוחה? <a class="gm" id="t_gm" href="${gmUrl(prev,e)}" target="_blank" rel="noopener">בדיקה ב-Google Maps</a></p>`:''}
      <div class="btns" style="margin-top:1rem"><button class="b p" type="submit">שמירה</button></div>
    </form>`);
  const sel=document.getElementById('t_mode'), gm=document.getElementById('t_gm');
  sel.onchange=()=>{if(gm&&prev){gm.href=gmUrl(prev,Object.assign({},e,{travelMode:sel.value}));}};
  document.getElementById('trForm').onsubmit=x=>{e=ev(id)||e;
    x.preventDefault();
    const newMin=document.getElementById('t_min').value, minChanged=newMin!==String(e.travelMin||'')||sel.value!==e.travelMode;
    e.travelMode=sel.value; e.travelMin=newMin; e.travelNote=document.getElementById('t_note').value;
    if(minChanged){e.travelEst=false; e.travelStale=false; e.travelFrom=prev?prev.id:null;}
    e.updated=stamp();
    save();closeSheet();render(true);
  };
  if(!e.travelMin)setTimeout(()=>{const m=document.getElementById('t_min');if(m)m.focus();},50);
}

function render(keepScroll){
  const y=window.scrollY;
  const days=sortedDays(); if(!days.length)return;
  const today=iso(new Date()), hm=nowHM();
  const inTrip=days.some(d=>d.date===today), beforeTrip=today<days[0].date;
  const rg=rangeOf(data.days);
  let html=`<section class="tripcard"><h1>${esc(data.meta.name)}</h1>
    <div class="range">${esc(fmtRange(rg.first,rg.last))} · ${rg.count} ${rg.count===1?'יום':'ימים'}</div>
    ${data.meta.notes?`<div class="notes">${esc(data.meta.notes)}</div>`:''}
    <div class="btns"><button class="b" data-act="editTrip" type="button">${RO?'פרטי הטיול':'עריכת פרטי הטיול'}</button><button class="b" data-act="trips" type="button">הטיולים שלי</button></div></section>`;
  if(RO)html=`<section class="viewbar"><div><b>צפייה בטיול${data.meta.view.owner?' של '+esc(data.meta.view.owner):''}</b><br><span>עודכן ${esc(fmtWhen(data.meta.view.savedAt))}</span></div>
    <div class="btns"><button class="b g" data-act="viewRefresh" type="button">רענון</button><button class="b" data-act="installHelp" type="button">התקנה</button></div></section>`+html;
  html+='<button class="addday" data-act="newDay" data-pos="start" type="button">+ הוספת יום לפני תחילת הטיול</button>';
  days.forEach((day,i)=>{
    const evs=eventsOf(day.date), active=evs.filter(e=>e.status!=='cancelled');
    const doneN=active.filter(e=>e.status==='done').length;
    const isToday=day.date===today;
    let cur=null,curLbl='',ended=false;
    let unmarked=new Set();
    if(isToday){const cs=currentStop(evs,hm);cur=cs.cur;ended=cs.ended;unmarked=cs.unmarked;if(cur)curLbl=(cur.time<=hm?'עכשיו':'הבא בתור')+' · ';}
    else if(beforeTrip&&i===0){cur=active[0]||null;if(cur)curLbl='מתחילים ב-';}
    const pastDay=day.date<today;

    html+=`<section class="day ${day.type==='nature'?'nature':'city'}" id="day-${day.date}" data-idx="${i}">
      <header class="dayhead"><div style="min-width:0">
        <div class="eyebrow">יום ${i+1} · ${esc(dayLabel(day.date))}${isToday?'<span class="todaybadge">היום</span>':''}</div>
        <h2>${esc(day.title)}</h2>
        <div class="sub">${active.length} תחנות${doneN?' · '+doneN+' מאחורייך':''}${day.sub?' · '+esc(day.sub):''}</div>
      </div><div class="headside">${SUN}<button class="hedit" data-act="editDay" data-date="${day.date}" type="button" aria-label="עריכת היום"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/></svg>עריכה</button></div></header><div class="daybody"><div class="trail">`;
    let n=0,prev=morningStay(day.date)?stayPoint(morningStay(day.date)):null;
    const items=evs.map(e=>({t:e.time,e}));
    data.stays.forEach(st=>{
      if(st.checkoutDate===day.date)items.push({t:st.checkoutTime||'11:00',stay:st,kind:'out'});
      if(st.checkinDate===day.date)items.push({t:st.checkinTime||'15:00',stay:st,kind:'in'});
    });
    items.sort((a,b)=>a.t.localeCompare(b.t)||((a.stay?(a.kind==='out'?-1:1):0)-(b.stay?(b.kind==='out'?-1:1):0)));
    items.forEach(it=>{
      if(it.stay){
        html+=`<div class="row"><div class="mkcol"></div><button class="vstop" data-act="stay" data-sid="${it.stay.id}" type="button">${BED}<span><span class="t">${it.kind==='in'?'צ׳ק-אין':'צ׳ק-אאוט עד'} <span dir="ltr">${esc(it.t)}</span></span><br><span class="m">${esc(it.stay.name)}</span></span></button></div>`;
        return;
      }
      const e=it.e;
      const num=e.status==='cancelled'?'':String(++n);
      html+=travelRow(prev,e,pastDay||e.status==='done');
      if(e===cur){
        html+=`<div class="row" id="curRow"><div class="mkcol"><div class="mk cur">${num}</div></div>
          <section class="card">${e.photos.length?`<div class="band photo">${photoImg(e.photos[e.photos.length-1])}</div>`:`<div class="band">${isFlight(e)?FLIGHT_BAND:(BAND[day.type]||BAND.city)}</div>`}<div class="body">
            <div class="lbl">${esc(curLbl)}<span dir="ltr">${esc(e.time)}</span>${isFlight(e)?' · להגיע לשדה עד <span dir="ltr">'+minusMin(e.time,e.airportBuffer||180)+'</span>':''}</div>
            <div class="t">${esc(stopTitle(e))}</div><div class="m">${isFlight(e)?stopMeta(e):esc(e.local)}</div>
            <div class="btns">
              <button class="b p" data-act="details" data-id="${e.id}" type="button">פרטים</button>
              <button class="b" data-act="driver" data-id="${e.id}" type="button">לנהג</button>
              ${isToday?`<button class="b g" data-act="done" data-id="${e.id}" type="button">✓ היה</button>`:''}
            </div></div></section></div>`;
      }else{
        const cls=e.status==='done'?'done':e.status==='cancelled'?'cancel':'';
        const mk=e.status==='done'?`<div class="mk done">${CHECK}</div>`:e.status==='cancelled'?'<div class="mk cancel">✕</div>':`<div class="mk todo">${num}</div>`;
        const tag=e.status==='cancelled'?`<span class="tag cancel">${e.replacedBy?'הוחלף':'בוטל'}</span>`:unmarked.has(e.id)?'<span class="tag" style="background:#EEE9F4;color:var(--ink-soft)">השעה עברה · לא סומן</span>':e.replaces?'<span class="tag changed">חלופה</span>':e.status==='changed'?'<span class="tag changed">השתנה</span>':'';
        html+=`<div class="row"><div class="mkcol">${mk}</div>
          <button class="stop ${cls}" data-act="details" data-id="${e.id}" type="button">
            <span class="t">${isFlight(e)?'<span class="ico">'+PLANE+'</span>':''}${esc(stopTitle(e))}</span><span class="m">${stopMeta(e)}${e.photos.length?' · '+e.photos.length+(e.photos.length===1?' תמונה':' תמונות'):''}</span>${tag}</button></div>`;
      }
      if(e.status!=='cancelled')prev=e;
    });
    if(ended){
      html+=`<div class="row" id="endedRow"><div class="mkcol"><div class="mk done">${CHECK}</div></div>
        <section class="ended"><div class="t">היום הסתיים</div>
        <div class="m" style="color:var(--ink-soft)">${RO?doneN+' תחנות היו היום.':doneN+' תחנות מאחורייך. רוצה לכתוב כמה מילים על היום?'}</div>
        <div class="btns"><button class="b p" data-act="summary" data-date="${day.date}" type="button">כתיבת סיכום היום</button></div></section></div>`;
    }
    html+='</div>';
    const night=stayForNight(day.date);
    if(night){
      const tot=dayDiff(night.checkinDate,night.checkoutDate), k=dayDiff(night.checkinDate,day.date)+1;
      html+=`<section class="stayrow"><button class="top" data-act="stay" data-sid="${night.id}" type="button">${BED}<span><span class="t">לינה: ${esc(night.name)}</span><br><span class="m">לילה ${k} מתוך ${tot}${night.address?' · '+esc(night.address):''}</span></span></button>
        <div class="btns"><button class="b" data-act="stayDriver" data-sid="${night.id}" type="button">הצגה לנהג</button>
        <a class="b" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(pt(stayPoint(night)))}" target="_blank" rel="noopener">ניווט למלון</a></div></section>`;
    }
    const altN=data.alternatives.filter(a=>a.city===dayCity(day)&&!a.used).length;
    html+=`<div class="dayactions">${dayRouteLinks(day,evs)}<button class="b p" data-act="dayMap" data-date="${day.date}" type="button">מפת היום</button>
      ${altN?`<button class="b" data-act="alts" data-date="${day.date}" type="button">חלופות ב${esc(dayCity(day))} (${altN})</button>`:''}</div>`;
    const un=unexported(day);
    const exp=day.exported&&!un
      ?`<span class="expstate ok">יוצא ✓ ${esc(new Date(day.exported).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}))}</span>`
      :`<span class="expstate no">${day.exported?un+' שינויים שלא גובו':'עוד לא יוצא'}</span>`;
    if(!RO||day.summary)html+=`<section class="summary"><h3>סיכום היום</h3>${day.summary?`<div class="txt">${esc(day.summary)}</div>`:'<div class="empty">עוד לא נכתב סיכום ליום הזה.</div>'}
      <div class="btns"><button class="b" data-act="summary" data-date="${day.date}" type="button">${day.summary?'עריכת הסיכום':'כתיבת סיכום'}</button>
      <button class="b" data-act="exportDay" data-date="${day.date}" type="button">ייצוא היום הזה</button></div>${exp}</section>`;
    html+=`<button class="b add" data-act="add" data-date="${day.date}" type="button">+ הוספה ליום הזה: תחנה, טיסה או לינה</button>`;
    if(i===days.length-1){
      html+=`<section class="alltrip"><h3 style="margin:0;font-size:1rem;color:var(--purple-dark)">סוף הטיול</h3>
        <p class="m" style="margin:.2rem 0;color:var(--ink-soft);font-size:.85rem">קובץ אחד עם כל הימים, בשביל ספר הזיכרונות.</p>
        <div class="btns"><button class="b g" data-act="exportAll" type="button">ייצוא כל הטיול</button></div></section>`;
      html+=`<button class="addday" style="width:100%" data-act="newDay" data-pos="end" type="button">+ הוספת יום בסוף הטיול</button>`;
    }
    html+='</div></section>';
  });
  html+=`<div class="testline">${storageOK?'שמירה במכשיר פעילה ✓'+(lastSaved?' · נשמר '+lastSaved:''):'⚠ השמירה במכשיר לא זמינה בדפדפן הזה'} · ${esc(browserName())} · ${deviceHe()}
    <br>נבנתה על ידי איריס, בעזרת Claude · גרסה 12<br><button class="reset" data-act="reset" type="button">איפוס לנתוני הדוגמה (לבדיקה בלבד)</button></div>`;
  document.getElementById('main').innerHTML=html;
  hydratePhotos(document.getElementById('main'));
  if(keepScroll)window.scrollTo(0,y);
  updateNav();
}

function scrollToFocus(){
  const el=document.getElementById('curRow')||document.getElementById('endedRow');
  if(el){el.scrollIntoView({block:'center'});return;}
  const days=sortedDays(),today=iso(new Date());
  const target=days.find(d=>d.date>=today)||days[days.length-1];
  const s=document.getElementById('day-'+target.date); if(s)s.scrollIntoView({block:'start'});
}
function visibleIdx(){
  const secs=[...document.querySelectorAll('.day')];let idx=0;
  secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<=60)idx=i;});
  return idx;
}
function jumpDay(delta){
  const secs=[...document.querySelectorAll('.day')];
  const i=Math.max(0,Math.min(secs.length-1,visibleIdx()+delta));
  secs[i].scrollIntoView({block:'start'});setTimeout(updateNav,50);
}
function updateNav(){
  const secs=document.querySelectorAll('.day'),i=visibleIdx();
  document.getElementById('prevDay').disabled=i<=0&&(!secs[0]||secs[0].getBoundingClientRect().top>=-5);
  document.getElementById('nextDay').disabled=i>=secs.length-1;
}
let navTimer=null;
window.addEventListener('scroll',()=>{clearTimeout(navTimer);navTimer=setTimeout(updateNav,80);},{passive:true});

/* Sheets */
const sheet=document.getElementById('sheet'), panel=document.getElementById('panel'), driver=document.getElementById('driver');
function openSheet(h){panel.innerHTML='<button class="close" data-act="close" type="button" aria-label="סגירה">✕</button>'+h;sheet.hidden=false;panel.scrollTop=0;}

function openDetails(id){

  const st=s=>`<button class="b ${e.status===s?'on':''}" data-act="status" data-id="${e.id}" data-st="${s}" type="button">${{done:'היה',cancelled:'בוטל',changed:'השתנה'}[s]}</button>`;
  const fl=isFlight(e)?`<dl class="finfo">
      <dt>טיסה</dt><dd>${esc(e.airline||'')} · <span dir="ltr">${esc(e.flightNo||'')}</span></dd>
      <dt>המראה</dt><dd>${esc(e.fromName||e.fromCode||'')}${e.terminal?' · טרמינל '+esc(e.terminal):''} · <span dir="ltr">${esc(e.time)}</span></dd>
      <dt>נחיתה</dt><dd>${esc(e.toName||e.toCode||'')} · <span dir="ltr">${esc(e.arrTime||'')}</span>${+e.arrPlusDays?' (למחרת)':''} שעון מקומי</dd>
      <dt>להגיע לשדה עד</dt><dd><span dir="ltr">${minusMin(e.time,e.airportBuffer||180)}</span> (${Math.round((+e.airportBuffer||180)/60*10)/10} שעות לפני)</dd>
      ${e.booking?`<dt>קוד הזמנה</dt><dd dir="ltr" style="text-align:right">${esc(e.booking)}</dd>`:''}
      ${e.seat?`<dt>מושב</dt><dd dir="ltr" style="text-align:right">${esc(e.seat)}</dd>`:''}
      ${e.baggage?`<dt>מזוודות</dt><dd>${esc(e.baggage)}</dd>`:''}

    <div class="m">${isFlight(e)?'':esc(e.local)+' · '}<span dir="ltr">${esc(e.time)}</span> · ${esc(dayLabel(e.date))}</div>${fl}
    ${e.address?`<p class="m">מיקום: <span dir="ltr">${esc(e.address)}</span></p>`:''}
    ${e.phone?`<p class="m">טלפון: <span dir="ltr" style="user-select:all">${esc(e.phone)}</span></p>`:''}
    ${e.details?`<p>${esc(e.details)}</p>`:''}
    <div class="btns">${st('done')}${st('changed')}${st('cancelled')}</div>
    ${e.cancelPolicy?`<p class="more" style="margin-top:.6rem"><b>מדיניות ביטול:</b> ${esc(e.cancelPolicy)}</p>`:''}
    ${e.replaces?`<div class="btns"><button class="b r" data-act="undoSwap" data-id="${e.id}" type="button">ביטול ההחלפה, חזרה ל${esc((ev(e.replaces)||{}).title||'תחנה המקורית')}</button></div>`:
      (e.status!=='cancelled'&&e.status!=='done'&&data.alternatives.some(a=>a.city===dayCity(dayOf(e.date)||{})&&!a.used))?`<div class="btns"><button class="b g" data-act="swap" data-id="${e.id}" type="button">החלפה בחלופה</button></div>`:''}
    ${RO?(e.note?`<h4>מה באמת עשיתי</h4><p style="white-space:pre-wrap">${esc(e.note)}</p>`:''):`<h4>מה באמת עשיתי</h4>
    <textarea id="noteBox" data-id="${e.id}" placeholder="רשמים, מחשבות, מה היה שונה מהתוכנית">${esc(e.note)}</textarea>
    <div class="saved" id="noteSaved">הרשמים נשמרים אוטומטית תוך כדי כתיבה</div>`}
    ${(!RO||e.photos.length)?`<h4>תמונות</h4>
    ${e.photos.length?`<div class="thumbs">${e.photos.map(p=>`<button data-act="photo" data-id="${e.id}" data-pid="${p.id}" type="button" aria-label="הצגת התמונה">${photoImg(p)}</button>`).join('')}</div>`:'<div class="locline">עוד אין תמונות בתחנה הזו.</div>'}

    <div class="locline">${e.lat!==undefined&&e.lat!==''&&e.lat!==null?'נשמר מיקום ✓':'עוד לא נשמר מיקום. בלי מיקום, התחנה לא תופיע במפת היום.'}</div>

    ${e.bgMore?`<details class="more"><summary><b>פרטים מעניינים</b></summary><p>${esc(e.bgMore)}</p></details>`:''}

    <div class="btns" style="margin-top:1rem">
      <button class="b" data-act="driver" data-id="${e.id}" type="button">הצגה לנהג</button>
      <button class="b" data-act="${isFlight(e)?'editFlight':'edit'}" data-id="${e.id}" type="button">עריכה</button>
    </div>`);
  hydratePhotos(panel);
}

/* Photos: add, view, delete */
const photoInput=document.getElementById('photoInput');
photoInput.addEventListener('change',async()=>{
  const e=ev(photoInput.dataset.id), files=[...photoInput.files]; photoInput.value='';
  if(!e||!files.length)return;
  const msg=document.getElementById('photoMsg'); if(msg)msg.textContent='מקטינה ושומרת…';
  let ok=0;
  for(const f of files){
    try{
      const r=await resizeImage(f), pid='p'+uid();
      await photoPut(pid,r.url);
      e.photos.push({id:pid,name:f.name,taken:f.lastModified?new Date(f.lastModified).toISOString():'',w:r.w,h:r.h,added:stamp()});
      ok++;
    }catch(err){if(msg)msg.textContent='⚠ לא הצלחתי לשמור את '+f.name+'. ייתכן שהמקום בדפדפן התמלא.';}
  }
  if(ok){e.updated=stamp();save();render(true);openDetails(e.id);
    const m2=document.getElementById('photoMsg'); if(m2)m2.textContent=(ok===1?'התמונה נשמרה ✓':ok+' תמונות נשמרו ✓');}
});
async function openPhoto(id,pid){
  const e=ev(id), p=e&&e.photos.find(x=>x.id===pid); if(!p)return;
  const u=await photoGet(pid);
  const when=p.taken?new Date(p.taken).toLocaleString('he-IL',{day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  driver.innerHTML=`<div class="photoview">${u?`<img src="${u}" alt="${esc(p.name)}">`:'<p>התמונה לא נמצאה במכשיר הזה.</p>'}</div>
    <div class="he" dir="ltr">${esc(p.name)}</div>${when?`<div class="he">תאריך הקובץ: ${esc(when)}</div>`:''}
    <div class="btns" style="width:100%;max-width:22rem"><button class="b r" data-act="delPhoto" data-id="${id}" data-pid="${pid}" type="button">מחיקת התמונה</button>
    <button class="b p" data-act="closeDriver" type="button">סגירה</button></div>`;
  driver.hidden=false;
}

/* Current location for a stop */
function myLocation(id){
  const e=ev(id), msg=document.getElementById('locMsg'); if(!e)return;
  if(!navigator.geolocation){if(msg)msg.textContent='⚠ הדפדפן הזה לא תומך באיתור מיקום.';return;}
  if(msg)msg.textContent='מאתרת מיקום…';
  navigator.geolocation.getCurrentPosition(p=>{
    e.lat=+p.coords.latitude.toFixed(6);e.lng=+p.coords.longitude.toFixed(6);e.updated=stamp();save();render(true);openDetails(id);
    const m=document.getElementById('locMsg');if(m)m.textContent='המיקום נשמר ✓ (דיוק של כ-'+Math.round(p.coords.accuracy)+' מטר)';
  },err=>{
    const m=document.getElementById('locMsg');if(!m)return;
    m.textContent=err.code===1?'⚠ אין הרשאה למיקום. כשהקובץ נפתח מהתיקייה, הדפדפן לפעמים חוסם את זה. אחרי ההתקנה זה אמור לעבוד.':
      err.code===3?'⚠ איתור המיקום לקח יותר מדי זמן. כדאי לנסות שוב במקום פתוח.':'⚠ לא הצלחתי לקבל מיקום.';
  },{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}

/* Day map (needs internet for the map itself) */
let leafletP=null;
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  if(leafletP)return leafletP;
  leafletP=new Promise((res,rej)=>{
    const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);
    const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload=()=>res();s.onerror=()=>{leafletP=null;rej(new Error('offline'));};document.head.appendChild(s);
  });
  return leafletP;
}
async function openDayMap(ds){
  const day=dayOf(ds), evs=eventsOf(ds).filter(e=>e.status!=='cancelled');
  const withLoc=evs.filter(e=>e.lat!==undefined&&e.lat!==''&&e.lat!==null);
  const list=evs.map((e,i)=>`<li>${i+1}. ${esc(e.title)} · <span dir="ltr">${esc(e.time)}</span>${withLoc.includes(e)?'':' (אין מיקום)'}</li>`).join('');
  openSheet(`<h3>מפת היום</h3><div class="m">${esc(dayLabel(ds))} · ${esc(day.title)}</div>
    ${withLoc.length?'<div class="mapwrap" id="dayMap"></div>':'<p class="locline" style="margin-top:.6rem">לתחנות של היום הזה עוד אין מיקום. אפשר לשמור מיקום בכל תחנה עם הכפתור "המיקום שלי עכשיו".</p>'}
    <div class="saved" id="mapMsg"></div><ol style="padding-inline-start:1.2rem;margin:.6rem 0 0;list-style:none">${list}</ol>`);
  if(!withLoc.length)return;
  try{await loadLeaflet();}catch(err){
    document.getElementById('dayMap').remove();
    const m=document.getElementById('mapMsg');if(m)m.textContent='⚠ אין חיבור לאינטרנט, לכן אי אפשר להציג את המפה. רשימת התחנות למטה.';return;
  }
  const el=document.getElementById('dayMap'); if(!el)return;
  const map=L.map(el,{zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const today=iso(new Date()), curE=ds===today?currentStop(evs,nowHM()).cur:null;
  const pts=[];
  for(const e of withLoc){
    const n=evs.indexOf(e)+1, cls=e===curE?'cur':e.status==='done'?'done':'';
    const icon=L.divIcon({className:'',html:`<div class="numpin ${cls}">${n}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
    const ph=e.photos.length?await photoGet(e.photos[e.photos.length-1].id):null;
    L.marker([e.lat,e.lng],{icon}).addTo(map).bindPopup(`<div class="pop"><b>${esc(e.title)}</b><br><span dir="ltr">${esc(e.time)}</span> · ${esc(e.local)}${ph?`<img src="${ph}" alt="">`:''}</div>`);
    pts.push([e.lat,e.lng]);
  }
  if(pts.length>1)L.polyline(pts,{color:'#6B3FA0',weight:4,dashArray:'2 10',lineCap:'round'}).addTo(map);
  if(pts.length===1)map.setView(pts[0],15);else map.fitBounds(pts,{padding:[30,30]});
  setTimeout(()=>map.invalidateSize(),150);
}

function openTrips(){
  save();
  const t=iso(new Date());
  const groups={now:[],soon:[],past:[]};
  idx.trips.forEach(x=>{if(!x.first||x.first>t)groups.soon.push(x);else if(x.last<t)groups.past.push(x);else groups.now.push(x);});
  groups.soon.sort((a,b)=>(a.first||'9').localeCompare(b.first||'9'));groups.past.sort((a,b)=>b.last.localeCompare(a.last));
  const item=x=>`<button class="tripitem ${x.id===activeId?'on':''}" data-act="openTrip" data-tid="${x.id}" type="button">
    <span class="t">${esc(x.name)}${x.viewOf?' · לצפייה':''}${x.id===activeId?' · פתוח עכשיו':''}</span><span class="m">${esc(fmtRange(x.first,x.last))}${x.count?' · '+x.count+' ימים':''}</span></button>`;
  const sec=(k,l)=>groups[k].length?`<h4>${l}</h4><div class="triplist">${groups[k].map(item).join('')}</div>`:'';
  openSheet(`<h3>הטיולים שלי</h3>${sec('now','עכשיו')}${sec('soon','בקרוב')}${sec('past','היו')}
    <div class="btns" style="margin-top:1rem"><button class="b g" data-act="newTrip" type="button">+ טיול חדש</button>
    <button class="b" data-act="importTrip" type="button">טעינת טיול מקובץ</button></div>
    <div class="saved" id="importMsg"></div>`);
}
function openNewTrip(){
  const t=iso(new Date());
  openSheet(`<h3>טיול חדש</h3>
    <form id="ntForm">
      <label class="f">שם הטיול<input name="name" id="nt_name" required></label>
      <div class="pair"><label class="f">מתאריך<input type="date" name="start" id="nt_start" value="${t}" required></label>
        <label class="f">עד תאריך<input type="date" name="end" id="nt_end" value="${shiftDate(t,6)}" required></label></div>
      <label class="f">עיר או אזור עיקרי<input name="city" id="nt_city"></label>
      <label class="f">סוג רוב הימים<select name="type" id="nt_type"><option value="city">ימי עיר</option><option value="nature">ימי טבע</option></select></label>
      <label class="f">כמה שורות על הטיול (לא חובה)<textarea name="notes" id="nt_notes" rows="3"></textarea></label>
      <div class="saved" id="ntMsg"></div>
      <div class="btns" style="margin-top:1rem"><button class="b p" type="submit">יצירת הטיול</button></div>
    </form>`);
  document.getElementById('ntForm').onsubmit=x=>{
    x.preventDefault();const f=Object.fromEntries(new FormData(x.target).entries());
    const n=dayDiff(f.start,f.end)+1;
    if(n<1){document.getElementById('ntMsg').textContent='⚠ תאריך הסיום צריך להיות אחרי תאריך ההתחלה.';return;}
    if(n>90){document.getElementById('ntMsg').textContent='⚠ אפשר ליצור טיול של עד 90 ימים.';return;}
    const days=[];for(let i=0;i<n;i++)days.push({date:shiftDate(f.start,i),title:f.city||('יום '+(i+1)),city:f.city,type:f.type,sub:'',summary:'',updated:stamp(),exported:''});
    createTrip({meta:{name:f.name,notes:f.notes},days,events:[],stays:[],alternatives:[]});
  };
}
function createTrip(d){
  saveTyping();save();
  const id='t'+uid();
  idx.trips.push(Object.assign({id,name:d.meta.name},rangeOf(d.days)));
  activeId=id;data=d;normalize();save();closeSheet();render();scrollToFocus();
}

/* Load a trip from a file made by "export whole trip" (or a trip file prepared for you) */
const importInput=document.getElementById('importInput');
importInput.addEventListener('change',async()=>{
  const file=importInput.files[0];importInput.value='';if(!file)return;
  const msg=document.getElementById('importMsg');if(msg)msg.textContent='טוענת…';
  try{
    const p=JSON.parse(await file.text());
    if(p.app!=='trip-app')throw new Error('not');
    if(p.kind!=='trip'){if(msg)msg.textContent='⚠ זה קובץ של יום בודד. לטעינת טיול צריך קובץ של כל הטיול.';return;}
    const events=[];
    for(const d of p.days){for(const e of (d.events||[])){
      const photos=[];for(const ph of (e.photos||[])){const pid=ph.id||('p'+uid());if(ph.data){try{await photoPut(pid,ph.data);}catch(err){}}const c=Object.assign({},ph,{id:pid});delete c.data;photos.push(c);}
      events.push(Object.assign({},e,{photos}));}}
    const days=p.days.map(d=>{const c=Object.assign({},d);delete c.events;return c;});
    createTrip({meta:{name:(p.trip&&p.trip.name)||('טיול מקובץ '+(days[0]?days[0].date:'')),notes:(p.trip&&p.trip.notes)||''},days,events,stays:p.stays||[],alternatives:p.alternatives||[]});
  }catch(err){const m=document.getElementById('importMsg');if(m)m.textContent='⚠ לא הצלחתי לקרוא את הקובץ. צריך קובץ שנוצר בכפתור "ייצוא כל הטיול".';}
});

function openDayNew(pos){
  const days=sortedDays(), ref=pos==='start'?days[0]:days[days.length-1];
  const date=pos==='start'?shiftDate(ref.date,-1):shiftDate(ref.date,1);
  /* A stay that ends on the new day (or starts on the old first day) can be stretched by one night */
  const st=pos==='end'?data.stays.find(v=>v.checkoutDate===date):data.stays.find(v=>v.checkinDate===ref.date);
  openSheet(`<h3>יום חדש ${pos==='start'?'לפני תחילת הטיול':'בסוף הטיול'}</h3><div class="m">${esc(dayLabel(date))}</div>

/* Contacts: copy name, address and phone from the phone's contact list (Chrome on Android only) */
function contactsSupported(){return false;} /* set aside: on Samsung + Chrome the picker returns no contact */
function contactBtn(nameId,addrId,phoneId){
  if(!contactsSupported())return '';
  return `<div class="btns"><button class="b" type="button" data-act="pickContact" data-n="${nameId}" data-a="${addrId}" data-p="${phoneId}">בחירה מאנשי הקשר</button></div><div class="saved" id="contactMsg"></div>`;
}
function addrText(a){
  if(!a)return '';
  return [(a.addressLine||[]).join(' '),a.city,a.region,a.postalCode,a.country].filter(Boolean).join(', ');
}
/* The list of supported contact fields is read once at start, so the picker opens directly from the tap */
let contactProps=['name','tel'];
if(contactsSupported()){try{navigator.contacts.getProperties().then(a=>{contactProps=['name','tel','address'].filter(p=>a.includes(p));}).catch(()=>{});}catch(e){}}
async function pickContact(t){
  const msg=document.getElementById('contactMsg');
  const say=x=>{const m=document.getElementById('contactMsg');if(m)m.textContent=x;};
  say('פותחת את אנשי הקשר…');
  let res;
  try{res=await navigator.contacts.select(contactProps,{multiple:true});}
  catch(err){say('⚠ לא הצלחתי לפתוח את אנשי הקשר ('+(err&&err.name||'שגיאה')+').');return;}
  if(!res||!res.length){say('לא נבחר איש קשר. אחרי שבוחרים שם ברשימה, צריך ללחוץ על הכפתור בתחתית הרשימה.');return;}
  const c=res[0], name=(c.name||[])[0]||'', tel=(c.tel||[])[0]||'', ad=addrText((c.address||[])[0]);
  const fill=(id,v,onlyEmpty)=>{const el=document.getElementById(id);if(!el||!v)return false;if(onlyEmpty&&el.value)return true;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));return true;};
  const okN=fill(t.dataset.n,name,true), okP=fill(t.dataset.p,tel), okA=fill(t.dataset.a,ad);
  say('התקבל מאנשי הקשר: '+(name||'בלי שם')+' · טלפון: '+(tel||'אין')+' · כתובת: '+(ad||'אין'+(contactProps.includes('address')?'':' (הטלפון לא מאפשר משיכת כתובת)'))
      +((tel&&!okP)||(ad&&!okA)?' · ⚠ לא הצלחתי למלא את השדות':' · עכשיו ללחוץ "שמירה" בתחתית הטופס'));
}

/* Alternatives: browse per city, swap into a stop's time slot, undo */
function altById(aid){return data.alternatives.find(a=>a.id===aid);}
/* Straight-line distance in km (haversine) */
function kmBetween(a,b){
  const R=6371,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function fmtKm(k){return k<1?'כ-'+(Math.round(k*10)*100)+' מטר':'כ-'+(k<10?k.toFixed(1):Math.round(k))+' ק״מ';}
function altsFor(city,origin){
  const list=data.alternatives.filter(a=>a.city===city&&!a.used).map(a=>({a,d:(hasLoc(origin)&&hasLoc(a))?kmBetween(origin,a):null}));
  return list.sort((x,y)=>((y.a.indoor?1:0)-(x.a.indoor?1:0))||((x.d===null)-(y.d===null))||((x.d||0)-(y.d||0)));

/* What travels between devices: everything except the per-device backup markers */
function syncable(d){
  return {meta:Object.assign({name:'',notes:''},d.meta||{}),
    days:(d.days||[]).map(x=>{const c=Object.assign({},x);delete c.exported;return c;}),
    events:d.events||[],stays:d.stays||[],alternatives:d.alternatives||[]};

function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}
const COLLS=[['days',x=>x.date],['events',x=>x.id],['stays',x=>x.id],['alternatives',x=>x.id]];
/* Three-way merge, detail by detail. Returns the merged trip, the questions to ask, and counts. */
function mergeTrips(L,R,B,tripName){
  const out={meta:null,days:[],events:[],stays:[],alternatives:[]},conflicts=[];let got=0,sent=0;
  const mergeItem=(l,r,b,coll,key)=>{
    if(same(l,r))return l;
    if(b){
      if(same(l,b)){got++;return r;}          /* changed (or deleted) only on the other device */
      if(same(r,b)){sent++;return l;}         /* changed (or deleted) only here */
    }else{
      if(!l){got++;return r;}                  /* first sync: something that exists on one side only is kept */
      if(!r){sent++;return l;}
    }
    if(!l||!r){                                /* deleted on one side, edited on the other */
      const c={trip:tripName,coll,key,l,r,fields:null};conflicts.push(c);return c;
    }
    const m=Object.assign({},l),fields=[];
    const keys=new Set([...Object.keys(l),...Object.keys(r)]);keys.delete('updated');
    let tookR=false,keptL=false;
    keys.forEach(k=>{
      const lv=l[k],rv=r[k],bv=b?b[k]:undefined;
      if(same(lv,rv))return;
      if(b&&same(lv,bv)){m[k]=rv;tookR=true;return;}
      if(b&&same(rv,bv)){keptL=true;return;}
      fields.push(k);
    });
    m.updated=[l.updated||'',r.updated||''].sort().pop();
    if(tookR)got++; if(keptL)sent++;
    if(!fields.length)return m;
    const c={trip:tripName,coll,key,l,r,m,fields};conflicts.push(c);return c;
  };
  out.meta=mergeItem(L.meta,R.meta,B&&B.meta,'meta','meta');

    const map=new Map(),order=[];
    const put=(side,arr)=>(arr||[]).forEach(x=>{const k=kf(x);if(!map.has(k)){map.set(k,{});order.push(k);}map.get(k)[side]=x;});
    put('l',L[coll]);put('r',R[coll]);put('b',B&&B[coll]);

  return m;

  const t={meta:trip.meta&&trip.meta.coll?null:trip.meta};
  COLLS.forEach(([coll])=>{t[coll]=trip[coll].map(x=>x&&x.coll?x.result:x).filter(Boolean);});
  if(trip.meta&&trip.meta.coll)t.meta=trip.meta.result;
  return t;
}

  if(e&&e.kind==='http'&&e.status===403)return '⚠ גוגל סירבה לגישה (403). אם הגדרות הפרויקט נעשו ממש עכשיו, נסי שוב בעוד כמה דקות.';
  if(e&&e.kind==='http')return '⚠ שגיאה מהדרייב ('+e.status+'). כלום לא אבד. אפשר לנסות שוב.';
  return '⚠ משהו השתבש בסנכרון. כלום לא אבד. אפשר לנסות שוב.';
}
function readTrip(id){try{const s=localStorage.getItem(tripKey(id));return s?JSON.parse(s):null;}catch(e){return null;}}
function readBase(id){try{const s=localStorage.getItem(baseKey(id));return s?JSON.parse(s):null;}catch(e){return null;}}
function writeTripLocal(id,trip,keepFrom){
  const ex=new Map(((keepFrom&&keepFrom.days)||[]).map(d=>[d.date,d.exported||'']));
  const full=Object.assign({},trip,{days:trip.days.map(d=>Object.assign({},d,{exported:ex.get(d.date)||''}))});
  const keep=data;data=full;normalize();const fixed=data;data=keep;
  localStorage.setItem(tripKey(id),JSON.stringify(fixed));
  localStorage.setItem(baseKey(id),JSON.stringify(syncable(fixed)));
  const en=idxEntry(id);if(en)Object.assign(en,{name:fixed.meta.name},rangeOf(fixed.days));
  return fixed;
}
function syncProgress(t){openSheet(`<h3>סנכרון</h3><p id="syncStep">${esc(t)}</p><div class="saved" id="syncMsg"></div>`);}
function step(t){const s=document.getElementById('syncStep');if(s)s.textContent=t;else syncProgress(t);}

async function runSync(){
  if(syncing)return;syncing=true;
  saveTyping();save();
  const report={trips:0,got:0,sent:0,newHere:0,newThere:0,photosUp:0,photosDown:0,removed:0,photoFail:0};
  try{
    syncProgress('בודקת מה יש בדרייב…');
    const folder=await gdFolder();
    const remote=await gdList('trip');
    const byFile=new Map(remote.map(f=>[f.id,f]));
    const linked=new Set(idx.trips.map(t=>t.driveId).filter(Boolean));
    /* Trips deleted on this device: move their Drive file to the Drive trash (it can be restored from there) */
    for(const g of (idx.gone||[])){if(byFile.has(g.driveId)){await gd('files/'+g.driveId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})});byFile.delete(g.driveId);}}
    idx.gone=[];saveIndex();
    /* Trips whose Drive file disappeared */
    for(const en of idx.trips.slice()){
      if(!en.driveId||en.noSync||byFile.has(en.driveId))continue;
      const opts=[{label:'להשאיר כאן ולהעלות שוב לדרייב',v:'keep',cls:'p'}];
      if(idx.trips.length>1)opts.push({label:'למחוק אותו גם מכאן',v:'del',cls:'r'});
      const a=await ask('טיול שנמחק מהדרייב',`<p>הטיול <b>${esc(en.name)}</b> כבר לא נמצא בדרייב. כנראה שנמחק במכשיר השני.</p>`,opts);
      if(a==='cancel')throw new SyncErr('cancel');
      if(a==='del'){try{localStorage.removeItem(tripKey(en.id));localStorage.removeItem(baseKey(en.id));}catch(e){}idx.trips=idx.trips.filter(x=>x.id!==en.id);report.removed++;}
      else{delete en.driveId;try{localStorage.removeItem(baseKey(en.id));}catch(e){}}
      saveIndex();
    }
    /* Trips on Drive that this device does not know yet */
    const ignored=new Set(idx.ignoredDrive||[]);
    idx.trips.forEach(t=>{if(t.noSync===undefined&&!t.driveId&&/\(דוגמה\)/.test(t.name||''))t.noSync=true;});
    const unlinkedRemote=remote.filter(f=>byFile.has(f.id)&&!ignored.has(f.id)&&!idx.trips.some(t=>t.driveId===f.id));
    const pairs=[];
    for(const en of idx.trips){if(en.driveId&&!en.noSync&&byFile.has(en.driveId))pairs.push({en,file:byFile.get(en.driveId)});}
    for(const en of idx.trips.filter(t=>!t.driveId&&!t.noSync)){
      const same1=unlinkedRemote.find(f=>(f.appProperties||{}).tid===en.id)||unlinkedRemote.find(f=>f.name===tripFileName(en.name));
      if(same1){
        const a=await ask('אותו טיול?',`<p>בדרייב כבר יש טיול בשם <b>${esc(en.name)}</b>, ויש טיול באותו שם גם כאן.</p><p class="locline">אם זה אותו טיול (למשל, נטען מאותו קובץ בשני המכשירים), כדאי לאחד. אם לא, הם יישמרו כשני טיולים נפרדים.</p>`,
          [{label:'זה אותו טיול, לאחד',v:'merge',cls:'p'},{label:'אלה שני טיולים שונים',v:'apart'},{label:'לא לסנכרן את הטיול הזה',v:'skip'}]);
        if(a==='cancel')throw new SyncErr('cancel');
        if(a==='merge'){en.driveId=same1.id;pairs.push({en,file:same1,first:true});unlinkedRemote.splice(unlinkedRemote.indexOf(same1),1);continue;}
        if(a==='skip'){en.noSync=true;idx.ignoredDrive=(idx.ignoredDrive||[]).concat(same1.id);unlinkedRemote.splice(unlinkedRemote.indexOf(same1),1);saveIndex();continue;}
      }
      pairs.push({en,file:null});
    }
    /* Merge each trip */
    for(const p of pairs){
      const local=readTrip(p.en.id);if(!local)continue;
      const L=syncable(local);
      if(!p.file){
        step('מעלה לדרייב: '+p.en.name);
        p.en.driveId=await gdPutTrip(null,folder,p.en.id,L);saveIndex();
        writeTripLocal(p.en.id,L,local);report.trips++;report.newThere++;continue;
      }
      step('מאחדת: '+p.en.name);
      const body=JSON.parse(await gd('files/'+p.file.id+'?alt=media',{text:true}));
      const R=syncable(body.trip||{});
      const B=p.first?null:readBase(p.en.id);
      const res=mergeTrips(L,R,B,p.en.name);
      let n=0;
      for(const c of res.conflicts){
        n++;const a=await askConflict(c,n,res.conflicts.length,body.device);
        if(a==='cancel')throw new SyncErr('cancel');
        c.result=resolveConflict(c,a);
      }
      const merged=finishMerge(res.trip);
      step('שומרת: '+p.en.name);
      if(!same(merged,R))await gdPutTrip(p.file.id,folder,(p.file.appProperties||{}).tid||p.en.id,merged);
      writeTripLocal(p.en.id,merged,local);saveIndex();
      report.trips++;report.got+=res.got;report.sent+=res.sent;
      if(p.en.id===activeId){data=null;load();}
    }
    /* New trips from Drive */
    for(const f of unlinkedRemote){
      step('מורידה מהדרייב: '+f.name.replace(/^שביל – |\.json$/g,''));
      const body=JSON.parse(await gd('files/'+f.id+'?alt=media',{text:true}));
      const tid=(body.tid&&!idxEntry(body.tid))?body.tid:('t'+uid());
      const trip=syncable(body.trip||{});
      idx.trips.push({id:tid,name:trip.meta.name||'טיול',driveId:f.id,first:'',last:'',count:0});
      writeTripLocal(tid,trip,null);saveIndex();report.trips++;report.newHere++;
    }
    /* Photos: upload what is only here, download what is only on Drive */
    step('בודקת תמונות…');
    const rph=await gdList('photo');const onDrive=new Map(rph.map(f=>[(f.appProperties||{}).pid,f.id]));
    const wanted=new Map();
    for(const en of idx.trips){if(en.noSync)continue;const t=readTrip(en.id);if(!t)continue;
      (t.events||[]).forEach(e=>(e.photos||[]).forEach(ph=>wanted.set(ph.id,ph.name||'')));}
    const list=[...wanted.keys()];let k=0;
    for(const pid of list){
      k++;
      const url=await photoGet(pid);
      try{
        if(url&&!onDrive.has(pid)){
          step('מעלה תמונה '+k+' מתוך '+list.length);
          const blob=await (await fetch(url)).blob();
          const mp=multipart({name:'תמונה '+pid+'.jpg',parents:[folder],appProperties:{shvil:'photo',pid}},blob);
          const up=await gd('files?uploadType=multipart&fields=id',{upload:true,method:'POST',headers:mp.headers,body:mp.body});onDrive.set(pid,up.id);report.photosUp++;
        }else if(!url&&onDrive.has(pid)){
          step('מורידה תמונה '+k+' מתוך '+list.length);
          const blob=await gd('files/'+onDrive.get(pid)+'?alt=media',{blob:true});
          const du=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});
          await photoPut(pid,du);report.photosDown++;
        }
      }catch(e){if(e&&e.kind&&e.kind!=='http')throw e;report.photoFail++;}
    }
    /* Shared trips: refresh their view copies */
    for(const en of idx.trips){
      if(en.noSync)continue;const t=readTrip(en.id);if(!t||!t.meta||!t.meta.share||!t.meta.share.fileId)continue;
      step('מעדכנת את עותק הצפייה: '+en.name);
      const before=JSON.stringify(t.meta.share);
      const sh=await publishView(t,folder,onDrive);
      if(sh)t.meta.share=sh;else delete t.meta.share;
      en.viewPublished=stamp();saveIndex();
      if(JSON.stringify(t.meta.share)!==before){const L2=syncable(t);if(en.driveId)await gdPutTrip(en.driveId,folder,en.id,L2);writeTripLocal(en.id,L2,t);saveIndex();}
      report.views=(report.views||0)+1;
    }
    setSyncState({lastSync:stamp()});
    if(!idxEntry(activeId)){activeId=null;}
    data=null;load();save();render(true);
    const lines=[];
    if(report.trips)lines.push(report.trips===1?'סונכרן טיול אחד.':'סונכרנו '+report.trips+' טיולים.');
    if(report.got)lines.push(report.got===1?'התקבל שינוי אחד מהמכשיר השני.':'התקבלו מהמכשיר השני '+report.got+' שינויים.');
    if(report.sent)lines.push(report.sent===1?'נשלח לדרייב שינוי אחד מכאן.':'נשלחו לדרייב '+report.sent+' שינויים מכאן.');
    if(!report.got&&!report.sent&&!report.newHere&&!report.newThere)lines.push('לא היו שינויים חדשים.');
    if(report.newHere)lines.push('טיולים חדשים שהגיעו מהדרייב: '+report.newHere+'.');
    if(report.newThere)lines.push('טיולים שהועלו לדרייב בפעם הראשונה: '+report.newThere+'.');
    if(report.photosUp||report.photosDown)lines.push('תמונות: '+report.photosUp+' הועלו, '+report.photosDown+' הורדו.');
    if(report.photoFail)lines.push('⚠ '+report.photoFail+' תמונות לא עברו. הן יעברו בסנכרון הבא.');
    if(report.views)lines.push(report.views===1?'עותק הצפייה של הטיול המשותף עודכן.':'עודכנו '+report.views+' עותקי צפייה.');
    if(report.removed)lines.push('טיולים שנמחקו מכאן: '+report.removed+'.');
    openSheet(`<h3>הסנכרון הסתיים ✓</h3>${lines.map(l=>`<p>${esc(l)}</p>`).join('')}<div class="btns" style="margin-top:1rem"><button class="b p" data-act="close" type="button">סגירה</button></div>`);
  }catch(e){
    if(e&&e.kind==='cancel'){closeSheet();}
    else openSheet(`<h3>הסנכרון לא הושלם</h3><p>${esc(errText(e))}</p><p class="locline">שינויים שכבר נשמרו נשארים. מה שלא הסתיים ימשיך בסנכרון הבא.</p>
      <div class="btns" style="margin-top:1rem"><button class="b p" data-act="sync" type="button">לנסות שוב</button><button class="b" data-act="close" type="button">סגירה</button></div>`);
    try{data=null;load();render(true);}catch(x){}
  }finally{syncing=false;pendingAsk=null;}
}

/* ===== Sharing a trip for viewing =====
   The owner publishes a separate "view copy" of one trip, holding only what she chose to show,
   and opens it for "anyone with the link" on Drive. Viewers open the link with no sign-in;
   the app reads the copy with a key that works only from this site and only for Drive. */
const G_VIEW_KEY='AIzaSyClEP36c2wGvYyDitPAxPVjWsPKLogLGvg';
const VIEW_ID=(()=>{try{return new URLSearchParams(location.search).get('view');}catch(e){return null;}})();
const SHARE_OPTS=[['details','פרטים (הטקסט החופשי בכל תחנה, הערות על הלינה והטיול)',true],['booking','מספרי הזמנה',false],['seat','מושב וכבודה בטיסות',false],
  ['cancel','מדיניות ביטול',false],['phone','טלפונים',false],['note','"מה באמת עשיתי"',false],['summary','סיכומי הימים',false],['photos','תמונות',false]];
function defaultShareOpts(){const o={};SHARE_OPTS.forEach(([k,,v])=>o[k]=v);return o;}
function viewLink(fid){return location.origin+location.pathname+'?view='+encodeURIComponent(fid);}
function shareText(name,fid){return 'שיתפתי איתך לצפייה את הטיול "'+name+'". הקישור נפתח בטלפון או במחשב, בלי הרשמה ובלי התקנה:\n'+viewLink(fid);}
function filterView(trip,o,photoMap){
  const t=JSON.parse(JSON.stringify(syncable(trip)));
  delete t.meta.share;delete t.meta.view;
  if(!o.details)t.meta.notes='';
  t.events.forEach(e=>{
    if(!o.details)e.details='';
    if(!o.booking)delete e.booking;
    if(!o.seat){delete e.seat;delete e.baggage;}
    if(!o.cancel)delete e.cancelPolicy;
    if(!o.phone)delete e.phone;
    if(!o.note)e.note='';
    e.photos=o.photos?(e.photos||[]).filter(p=>photoMap&&photoMap.has(p.id)).map(p=>Object.assign({},p,{driveId:photoMap.get(p.id)})):[];
  });
  t.stays.forEach(s=>{if(!o.booking)delete s.booking;if(!o.phone)delete s.phone;if(!o.cancel)delete s.cancelPolicy;if(!o.details)s.notes='';});
  t.days.forEach(d=>{if(!o.summary)d.summary='';});
  t.alternatives.forEach(a=>{if(!o.cancel)delete a.cancelPolicy;if(!o.details)a.details='';});
  return t;
}
/* Publishes (or refreshes) the view copy of one trip. Returns the updated share settings, or null if the copy was removed elsewhere. */
async function publishView(trip,folder,photoMap){
  const sh=Object.assign({pubPhotos:[]},trip.meta.share);const o=Object.assign(defaultShareOpts(),sh.opts||{});
  if(o.photos){
    for(const e of trip.events)for(const p of (e.photos||[])){
      if(!photoMap.has(p.id)){const url=await photoGet(p.id);if(url){
        const blob=await (await fetch(url)).blob();
        const mp=multipart({name:'תמונה '+p.id+'.jpg',parents:[folder],appProperties:{shvil:'photo',pid:p.id}},blob);
        const r=await gd('files?uploadType=multipart&fields=id',{upload:true,method:'POST',headers:mp.headers,body:mp.body});photoMap.set(p.id,r.id);}}
      if(photoMap.has(p.id)&&!sh.pubPhotos.includes(p.id)){
        await gd('files/'+photoMap.get(p.id)+'/permissions?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'reader',type:'anyone'})});
        sh.pubPhotos.push(p.id);
      }
    }
  }else if(sh.pubPhotos.length){
    for(const pid of sh.pubPhotos){if(photoMap.has(pid)){try{await gd('files/'+photoMap.get(pid)+'/permissions/anyoneWithLink',{method:'DELETE'});}catch(e){if(!(e.kind==='http'&&e.status===404))throw e;}}}
    sh.pubPhotos=[];
  }
  const body={app:'trip-app',kind:'view',version:1,owner:sh.owner||'',savedAt:stamp(),trip:filterView(trip,o,photoMap)};
  const blob=new Blob([JSON.stringify(body)],{type:'application/json'});
  if(sh.fileId){
    const mp=multipart({name:'צפייה – '+tripFileName(trip.meta.name)},blob);
    try{await gd('files/'+sh.fileId+'?uploadType=multipart&fields=id',{upload:true,method:'PATCH',headers:mp.headers,body:mp.body});}
    catch(e){if(e.kind==='http'&&e.status===404)return null;throw e;}
  }else{
    const mp=multipart({name:'צפייה – '+tripFileName(trip.meta.name),mimeType:'application/json',parents:[folder],appProperties:{shvil:'view'}},blob);
    const r=await gd('files?uploadType=multipart&fields=id',{upload:true,method:'POST',headers:mp.headers,body:mp.body});
    await gd('files/'+r.id+'/permissions?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'reader',type:'anyone'})});
    sh.fileId=r.id;
  }
  return sh;
}

    try{
      try{await gd('files/'+sh.fileId,{method:'DELETE'});}catch(e){if(!(e.kind==='http'&&e.status===404))throw e;}
      if((sh.pubPhotos||[]).length){const pm=await photoMapNow();for(const pid of sh.pubPhotos){if(pm.has(pid)){try{await gd('files/'+pm.get(pid)+'/permissions/anyoneWithLink',{method:'DELETE'});}catch(e){}}}}
      delete data.meta.share;save();
      openSheet(`<h3>השיתוף הופסק</h3><p>הקישור כבר לא עובד. מי שהתקין את האפליקציה ישמור את הגרסה האחרונה שראה, בלי עדכונים.</p><p class="locline">כדי שגם המכשיר השני יידע שהשיתוף הופסק, כדאי לסנכרן.</p>`);
    }catch(e){syncMsg(errText(e));}
  });
}
function shareCopy(){
  const ta=document.getElementById('shareTxt');if(!ta)return;
  const done=()=>syncMsg('ההודעה הועתקה ✓ אפשר להדביק בוואטסאפ');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ta.select();try{document.execCommand('copy');done();}catch(e){}});}
  else{ta.select();try{document.execCommand('copy');done();}catch(e){}}
}
function shareSend(){
  const ta=document.getElementById('shareTxt');if(!ta)return;

/* The viewer side */
async function fetchView(fid){
  let r;
  try{r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fid)+'?alt=media&key='+G_VIEW_KEY,{cache:'no-store'});}catch(e){throw new SyncErr('net');}
  if(r.status===404||r.status===403)throw new SyncErr('gone',r.status);
  if(!r.ok)throw new SyncErr('http',r.status);
  const b=await r.json();if(!b||b.kind!=='view')throw new SyncErr('gone');
  return b;
}
function storeView(fid,body){
  if(!idx)idx={trips:[],lastOpened:null};
  const trip=syncable(body.trip||{});trip.meta.view={owner:body.owner||'',savedAt:body.savedAt||'',fileId:fid,fetched:stamp()};
  let en=idx.trips.find(t=>t.viewOf===fid);
  if(!en){en={id:'v'+uid(),viewOf:fid,noSync:true,name:trip.meta.name};idx.trips.push(en);}
  const keep=data;data=trip;normalize();const fixed=data;data=keep;
  try{localStorage.setItem(tripKey(en.id),JSON.stringify(fixed));}catch(e){}
  Object.assign(en,{name:fixed.meta.name},rangeOf(fixed.days));saveIndex();
  return en.id;
}
async function viewPhotos(trip){
  let n=0;
  for(const e of trip.events||[])for(const p of (e.photos||[])){
    if(!p.driveId||await photoGet(p.id))continue;
    try{const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(p.driveId)+'?alt=media&key='+G_VIEW_KEY);if(!r.ok)continue;
      const blob=await r.blob();const du=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});
      await photoPut(p.id,du);n++;}catch(e){}
  }
  return n;
}
async function openView(fid,mode){
  const body=await fetchView(fid);
  const id=storeView(fid,body);
  const wasActive=id===activeId;
  activeId=id;data=null;load();idx.lastOpened=id;saveIndex();
  if(mode==='silent'&&wasActive)render(true);else{closeSheet();render();scrollToFocus();}
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  viewPhotos(data).then(n=>{if(n&&activeId===id)render(true);});
}
function viewErr(e){
  const local=VIEW_ID&&idx&&idx.trips.find(t=>t.viewOf===VIEW_ID);
  if(local&&activeId!==local.id){activeId=local.id;data=null;load();render();scrollToFocus();}
  const t=e&&e.kind==='gone'?'הקישור לא פעיל. ייתכן שהשיתוף הופסק, או שהקישור הועתק לא בשלמותו.'
    :e&&e.kind==='net'?(local?'אין חיבור לאינטרנט. מוצגת הגרסה האחרונה שנשמרה במכשיר.':'אין חיבור לאינטרנט. צריך אינטרנט כדי לפתוח את הטיול בפעם הראשונה.')
    :'לא הצלחתי לטעון את הטיול. אפשר לנסות שוב מאוחר יותר.';
  openSheet(`<h3>צפייה בטיול</h3><p>${esc(t)}</p>`);
}
function viewRefresh(){
  const v=data.meta.view;if(!v)return;
  if(!navigator.onLine){openSheet('<h3>רענון</h3><p>אין חיבור לאינטרנט. מוצגת הגרסה האחרונה שנשמרה במכשיר.</p>');return;}
  openSheet('<h3>רענון</h3><p id="syncStep">בודקת אם יש עדכונים…</p>');
  openView(v.fileId).then(()=>openSheet(`<h3>רענון</h3><p>הטיול מעודכן ✓</p><p class="locline">עודכן לאחרונה על ידי ${esc(data.meta.view.owner||'הבעלים')}: ${esc(fmtWhen(data.meta.view.savedAt))}</p>`)).catch(viewErr);
}

const RO_BLOCK=new Set(['newDay','editDay','done','summary','exportDay','exportAll','add','status','swap','undoSwap','pickAlt','doSwap','addPhoto','delPhoto',
  'myLoc','edit','editFlight','stayEdit','stayDel','stayLoc','travel','reset','addStop','addFlight','addStay','del','delDay','share','sharePublish','shareStop']);

/* Export */
function fileStamp(){const n=new Date(),z=v=>String(v).padStart(2,'0');return iso(n)+'-'+z(n.getHours())+z(n.getMinutes());}
async function dayPayload(day){
  const evs=[];
  for(const e of eventsOf(day.date)){
    const photos=[];
    for(const p of e.photos){photos.push(Object.assign({},p,{data:await photoGet(p.id)}));}
    evs.push(Object.assign({},e,{photos}));
  }
  return Object.assign({},day,{events:evs});
}
async function exportDay(ds){
  saveTyping();
  const days=sortedDays(),i=days.findIndex(d=>d.date===ds),day=days[i];
  const name='trip-day'+(i+1)+'-'+day.date+'-'+device()+'.json';
  const payload={app:'trip-app',version:4,kind:'day',exported:stamp(),device:deviceHe(),dayNumber:i+1,day:await dayPayload(day),
    stays:data.stays.filter(st=>st.checkinDate<=day.date&&day.date<=st.checkoutDate)};
  shareFile(JSON.stringify(payload,null,2),name,()=>{dayOf(ds).exported=stamp();save();render(true);});
}
async function exportAll(){
  saveTyping();
  const name='trip-all-days-'+fileStamp()+'-'+device()+'.json';
  const all=[];for(const d of sortedDays())all.push(await dayPayload(d));
  const payload={app:'trip-app',version:4,kind:'trip',exported:stamp(),device:deviceHe(),trip:{name:data.meta.name,notes:data.meta.notes||''},days:all,alternatives:data.alternatives,stays:data.stays};
  shareFile(JSON.stringify(payload,null,2),name,()=>{const t=stamp();data.days.forEach(d=>d.exported=t);save();render(true);});
}
function shareFile(text,name,onDone){
  const blob=new Blob([text],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).then(onDone).catch(err=>{if(err&&err.name==='AbortError')return;downloadBlob(blob,name);onDone();});
      return;
    }
  }catch(e){}
  downloadBlob(blob,name);onDone();
}
function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

    else{t.dataset.sure='1';t.textContent='בטוחה? למחוק';}
