  else if(a==='pickAlt')confirmSwap(id,t.dataset.aid);
  else if(a==='doSwap')doSwap(id,t.dataset.aid);
  else if(a==='undoSwap'){
    if(t.dataset.sure)undoSwap(id);
    else{t.dataset.sure='1';t.textContent='בטוחה? לחיצה נוספת תבטל את ההחלפה';}
  }
  else if(a==='myLoc')myLocation(id);
  else if(a==='dayMap')openDayMap(ds);
  else if(a==='reset'){
    if(t.dataset.sure){const nm=data.meta?data.meta.name:'';data=sample();normalize();data.meta={name:nm||'טיול לדוגמה',notes:''};save();render();scrollToFocus();}
    else{t.dataset.sure='1';t.textContent='בטוחה? כל מה שכתבת יימחק מהמכשיר הזה (לחיצה נוספת לאישור)';}
  }
  else if(a==='travel')openTravel(id);
  else if(a==='driver')openDriver(id);
  else if(a==='closeDriver')driver.hidden=true;
  else if(a==='close')closeSheet();
  else if(a==='edit')openEdit(id);
  else if(a==='add')openAddChooser(ds);
  else if(a==='pickContact')pickContact(t);
  else if(a==='sync')startSync();
  else if(a==='syncOff')syncOff();
  else if(a==='trips')openTrips();
  else if(a==='openTrip'){if(t.dataset.tid===activeId)closeSheet();else switchTrip(t.dataset.tid);}
  else if(a==='newTrip')openNewTrip();
  else if(a==='importTrip')importInput.click();
  else if(a==='editTrip')openTripEdit();
  else if(a==='size'){setSize(t.dataset.size);openMenu();}
  else if(a==='delTrip'){
    if(t.dataset.sure){const gone=activeId;const ge=idxEntry(gone);if(ge&&ge.driveId&&!ge.noSync){idx.gone=(idx.gone||[]).concat({driveId:ge.driveId,name:ge.name});}
      try{localStorage.removeItem(tripKey(gone));localStorage.removeItem(baseKey(gone));}catch(e){}
      idx.trips=idx.trips.filter(x=>x.id!==gone);if(!idx.trips.length){saveIndex();idx=null;try{localStorage.removeItem(IDX_KEY);}catch(e){}}activeId=null;data=null;load();saveIndex();closeSheet();render();scrollToFocus();}
    else{t.dataset.sure='1';const ge=idxEntry(activeId);t.textContent=(ge&&ge.driveId&&!ge.noSync)?'בטוחה? הטיול יימחק מהמכשיר הזה, ובסנכרון הבא גם מהדרייב':'בטוחה? הטיול יימחק מהמכשיר הזה';}
  }
  else if(a==='editDay')openDayEdit(ds);
  else if(a==='newDay')openDayNew(t.dataset.pos);
  else if(a==='delDay'){
    if(t.dataset.sure){data.days=data.days.filter(d=>d.date!==ds);save();closeSheet();render(true);}
    else{t.dataset.sure='1';t.textContent='בטוחה? למחוק את היום';}
  }
  else if(a==='addStop')openEdit(null,ds);
  else if(a==='addFlight')openFlightEdit(null,ds);
  else if(a==='addStay')openStayEdit(null,ds);

  else if(a==='stay')openStay(t.dataset.sid);
  else if(a==='stayEdit')openStayEdit(t.dataset.sid);

  else if(a==='stayDel'){
    if(t.dataset.sure){data.stays=data.stays.filter(v=>v.id!==t.dataset.sid);save();closeSheet();render(true);}
    else{t.dataset.sure='1';t.textContent='בטוחה? למחוק את הלינה';}
  }
  else if(a==='summary')openSummary(ds);
  else if(a==='exportDay')exportDay(ds);
  else if(a==='exportAll')exportAll();
  else if(a==='done'){const e=ev(id);e.status='done';e.updated=stamp();save();render(true);}
  else if(a==='status'){const e=ev(id);e.status=(e.status===t.dataset.st)?'planned':t.dataset.st;e.updated=stamp();save();render(true);openDetails(id);}
  else if(a==='del'){
    if(t.dataset.sure){const e=ev(id);touchDay(e.date);data.events=data.events.filter(v=>v.id!==id);save();closeSheet();render(true);}
    else{t.dataset.sure='1';t.textContent='בטוחה? למחוק לגמרי';}
  }
});
document.addEventListener('keydown',x=>{if(x.key==='Escape'){saveTyping();if(!driver.hidden)driver.hidden=true;else if(!sheet.hidden)closeSheet();}});
document.getElementById('prevDay').onclick=()=>jumpDay(-1);
document.getElementById('nextDay').onclick=()=>jumpDay(1);
document.getElementById('menuBtn').onclick=()=>{saveTyping();openMenu();};

/* Always show the saved version when the page comes back into view */
function refresh(){if(sheet.hidden){load();}render(true);}
/* Opening position: always start at today's current stop. The browser's own scroll memory is switched off,
   and the jump is repeated after fonts load (which shifts the layout) unless the user already started scrolling.
   Coming back after more than 2 minutes away also returns to today's stop. */
try{history.scrollRestoration='manual';}catch(e){}
let userScrolled=false, hiddenAt=0;
['touchstart','wheel','keydown'].forEach(t=>window.addEventListener(t,()=>{userScrolled=true;},{passive:true,once:true}));
function focusIfIdle(){if(!userScrolled)scrollToFocus();}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){saveTyping();hiddenAt=Date.now();}
  else{refresh();if(hiddenAt&&Date.now()-hiddenAt>120000)scrollToFocus();}
});
window.addEventListener('pagehide',saveTyping);
window.addEventListener('pageshow',x=>{if(x.persisted){refresh();scrollToFocus();}});
window.addEventListener('load',focusIfIdle);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(focusIfIdle);
setInterval(()=>{if(sheet.hidden)render(true);},60000);

/* Install and offline support: register the offline helper, and offer a refresh when a new version arrives */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    const offer=w=>{
      if(document.getElementById('updBar'))return;
      const b=document.createElement('div');b.id='updBar';
      b.style.cssText='position:fixed;left:12px;right:12px;top:calc(.6rem + env(safe-area-inset-top,0px));z-index:45;background:#EFC12E;color:#241A2B;border:3px solid #4A2063;border-radius:1rem;padding:.8rem 1rem;display:flex;gap:.7rem;align-items:center;justify-content:space-between;font-size:1.05rem;font-weight:700;box-shadow:0 6px 18px rgba(36,26,43,.35)';
      b.innerHTML='<span>יש גרסה חדשה של האפליקציה</span><button class="b p" type="button" style="flex:none;min-height:2.8rem">עדכון עכשיו</button>';
      b.querySelector('button').onclick=()=>{saveTyping();w.postMessage('skipWaiting');};
      document.body.appendChild(b);
    };
    if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)offer(w);});});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload();});
}

loadSize();
(function start(){
  let known=false;try{known=!!(localStorage.getItem(IDX_KEY)||localStorage.getItem(KEY));}catch(e){}
  if(VIEW_ID&&!known){
    document.getElementById('main').innerHTML='<section class="viewbar"><b>טוענת את הטיול ששותף איתך…</b></section>';

  }
  load();render();scrollToFocus();
  if(VIEW_ID)openView(VIEW_ID).catch(viewErr);

})();
